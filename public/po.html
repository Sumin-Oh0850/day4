// ================================================================ 렌더러 / 씬
const renderer = new THREE.WebGLRenderer({ antialias: true });

// ================================================================ 지형 (제주 DEM)
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const mix = (a, b, t) => a + (b - a) * t;

const WIDTH = 100, SCALE = WIDTH / D.kmX, DEPTH = D.kmY * SCALE;
const EX = 2.4;

function blur(src, r, w, h) {
  const tmp = new Float32Array(w * h), out = new Float32Array(w * h), n = 2 * r + 1;

  for (let x = 0; x < w; x++) { let s = 0; for (let y = -r; y <= r; y++) s += tmp[clamp(y, 0, h - 1) * w + x]; for (let y = 0; y < h; y++) { out[y * w + x] = s / n; s += tmp[clamp(y + r + 1, 0, h - 1) * w + x] - tmp[clamp(y - r, 0, h - 1) * w + x]; } }
  return out;
}
let mask = new Float32Array(GW * GH); for (let i = 0; i < mask.length; i++) mask[i] = heights[i] > 0 ? 1 : 0;
for (let k = 0; k < 3; k++) mask = blur(mask, 6, GW, GH);
const hash = (x, y) => { let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; };

const geo = new THREE.PlaneGeometry(WIDTH, DEPTH, GW - 1, GH - 1);
geo.rotateX(-Math.PI / 2);
const pos = geo.attributes.position, colArr = new Float32Array(pos.count * 3), landY = new Float32Array(GW * GH);
function buildTerrain() {
  for (let i = 0; i < pos.count; i++) {
    const hm = heights[i], ix = i % GW, iy = (i / GW) | 0;

      if (hm <= 0) c = [0.25, 0.5, 0.58];
      else if (hm < 8) c = [0.82, 0.76, 0.56];
      else if (hm < 700) { const t = hm / 700; c = [0.26 + 0.1 * t + n, 0.5 - 0.12 * t + n, 0.2 + 0.03 * t]; }

}

function hAt(x, z) {
  const u = clamp((x / WIDTH + 0.5) * (GW - 1), 0, GW - 1.001), v = clamp((z / DEPTH + 0.5) * (GH - 1), 0, GH - 1.001);

  light:  { name: "등대", color: "#d9423a", on: true },
  dol:    { name: "돌하르방", color: "#6a6a6a", on: true },
};
const groups = {}, labelsEl = $("labels"), labelItems = [], clickable = [], anim = [];
for (const k in LAYERS) { groups[k] = new THREE.Group(); scene.add(groups[k]); }
const matBasalt = new THREE.MeshStandardMaterial({ color: 0x6b6b6b, roughness: 1 });

function addLabel(layer, text, point, cls, yOff) {
  const el = document.createElement("div"); el.className = "lb " + (cls || ""); el.textContent = text; labelsEl.appendChild(el);
  const item = { layer, el, point: point.clone().add(new THREE.Vector3(0, yOff || 0.8, 0)), text };
  labelItems.push(item); return item;
}
function register(obj, info) { obj.userData.info = info; obj.traverse(o => { o.userData.info = info; }); clickable.push(obj); }

// --- 관광지 막대 (방문객 수)
const bars = {};
for (const name in SPOTS) {
  const s = SPOTS[name], p = groundPos(s.lon, s.lat), g = new THREE.Group(); g.position.copy(p);
  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1, 20).translate(0, 0.5, 0), new THREE.MeshStandardMaterial({ color: 0xff8a1f, emissive: 0x401800, roughness: 0.5 }));
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.55, 20, 14), new THREE.MeshStandardMaterial({ color: 0xffd08a, emissive: 0x663300 }));
  g.add(cyl, cap); groups.spot.add(g);
  const info = { kind: "spot", name, type: "관광지", desc: s.desc };
  register(g, info);
  const lb = addLabel("spot", name, p, "spot", 0);
  bars[name] = { g, cyl, cap, cur: 0.01, tgt: 0.01, base: p, lb, info };
}

// --- 오름
for (const o of OREUM) {
  const p = groundPos(o.lon, o.lat), m = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x5e9a46, roughness: 1 }));
  m.scale.set(o.r, o.h, o.r); m.position.copy(p); m.position.y -= 0.05; groups.oreum.add(m);
  register(m, { name: o.name, type: "오름", desc: o.desc });
  addLabel("oreum", o.name, p, "", o.h + 0.2);
}
{ // 한라산 백록담 깃발
  const p = groundPos(126.5312, 33.3617), pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2, 8).translate(0, 1, 0), new THREE.MeshStandardMaterial({ color: 0xffffff }));
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.55).translate(0.45, 1.65, 0), new THREE.MeshStandardMaterial({ color: 0xff8a1f, side: THREE.DoubleSide }));
  const g = new THREE.Group(); g.add(pole, flag); g.position.copy(p); groups.oreum.add(g);
  register(g, { name: "한라산 백록담 (1,947m)", type: "산", desc: "제주의 중심에 솟은 화산. 정상에는 분화호 백록담이 있습니다. (지도 데이터상 최고점 약 1,905m)" });
  addLabel("oreum", "한라산 백록담", p, "", 2.4);
}

// --- 풍력발전기
const rotors = [];
for (const w of WIND) {
  let first = null;
  for (const [lon, lat] of w.pts) {
    const p = groundPos(lon, lat), g = new THREE.Group();
    const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.06, 1.7, 8).translate(0, 0.85, 0), new THREE.MeshStandardMaterial({ color: 0xf4f7f8 }));
    const rot = new THREE.Group(); rot.position.set(0, 1.7, 0.08);
    for (let i = 0; i < 3; i++) { const b = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.95, 0.015).translate(0, 0.48, 0), new THREE.MeshStandardMaterial({ color: 0xffffff })); b.rotation.z = i * Math.PI * 2 / 3; rot.add(b); }
    g.add(tower, rot); g.position.copy(p); g.rotation.y = 0.5; groups.wind.add(g); rotors.push(rot);
    register(g, { name: w.name, type: "풍력발전기", desc: "제주의 바람을 전기로 바꾸는 풍력발전 단지 (위치는 대략)." });
    first = first || p;
  }
  addLabel("wind", w.name, first, "", 2.4);
}

// --- 등대
const beams = [];
for (const l of LIGHT) {
  const p = groundPos(l.lon, l.lat), g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.22, 1.4, 12).translate(0, 0.7, 0), new THREE.MeshStandardMaterial({ color: 0xffffff }));
  const band = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.19, 0.3, 12).translate(0, 0.6, 0), new THREE.MeshStandardMaterial({ color: 0xd9423a }));
  const top = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 10).translate(0, 1.5, 0), new THREE.MeshBasicMaterial({ color: 0xfff2a8 }));
  const beam = new THREE.Mesh(new THREE.ConeGeometry(0.35, 4, 16, 1, true).rotateZ(Math.PI / 2).translate(2.1, 0, 0), new THREE.MeshBasicMaterial({ color: 0xfff2a8, transparent: true, opacity: 0.3, side: THREE.DoubleSide, depthWrite: false }));
  const bg = new THREE.Group(); bg.position.y = 1.5; bg.add(beam); beams.push(bg);
  g.add(body, band, top, bg); g.position.copy(p); groups.light.add(g);
  register(g, { name: l.name, type: "등대", desc: l.desc });
  addLabel("light", l.name, p, "", 2.0);
}

// --- 돌하르방
for (const d of DOL) {
  const p = groundPos(d.lon, d.lat), g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.26, 0.6, 12).translate(0, 0.3, 0), matBasalt);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 14, 12).translate(0, 0.82, 0), matBasalt);
  const hat = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.28, 0.14, 14).translate(0, 1.06, 0), matBasalt);
  const nose = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.1, 0.08).translate(0, 0.82, 0.21), matBasalt);
  g.add(body, head, hat, nose); g.scale.setScalar(1.5); g.position.copy(p); groups.dol.add(g);
  register(g, { name: d.name, type: "돌하르방", desc: "제주를 상징하는 현무암 수호 석상 (위치는 대략)." });
  addLabel("dol", d.name, p, "", 1.9);
}

// --- 항·포구
for (const pt of PORT) {
  const p = groundPos(pt.lon, pt.lat), g = new THREE.Group();
  const dock = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.12, 0.3).translate(0, 0.06, 0), new THREE.MeshStandardMaterial({ color: 0xb9b3a4 }));
  const hull = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.15, 0.2).translate(0.3, 0.1, 0.45), new THREE.MeshStandardMaterial({ color: 0x1a78b0 }));
  const sail = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.5, 4).translate(0.3, 0.45, 0.45), new THREE.MeshStandardMaterial({ color: 0xffffff }));
  g.add(dock, hull, sail); g.position.copy(p); groups.port.add(g);
  register(g, { name: pt.name, type: "항·포구", desc: "제주의 주요 항·포구 (위치는 대략)." });
  addLabel("port", pt.name, p, "", 1.0);
}

// --- 올레길
for (const r of OLLE) {
  const pts = r.pts.map(([lon, lat]) => { const p = groundPos(lon, lat); p.y += 0.18; return p; });
  const curve = new THREE.CatmullRomCurve3(pts), tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 80, 0.09, 6, false), new THREE.MeshBasicMaterial({ color: 0xe8d300 }));
  groups.olle.add(tube); register(tube, { name: r.name, type: "올레길", desc: "제주 올레길의 대략적인 경로입니다. 실제 코스와 다를 수 있습니다." });
  addLabel("olle", r.name, pts[Math.floor(pts.length / 2)], "", 0.6);
}

// --- 감귤 재배지 (인스턴스)
{
  const N = 170, total = CITRUS.length * N;
  const crown = new THREE.InstancedMesh(new THREE.SphereGeometry(0.14, 8, 6), new THREE.MeshStandardMaterial({ color: 0x2f7a2a }), total);
  const fruit = new THREE.InstancedMesh(new THREE.SphereGeometry(0.06, 6, 5), new THREE.MeshStandardMaterial({ color: 0xff9a1a, emissive: 0x4a2400 }), total * 2);
  const m = new THREE.Matrix4(); let ci = 0, fi = 0;
  CITRUS.forEach((z, zi) => {
    const c = lonlat(z.lon, z.lat);
    for (let i = 0; i < N; i++) {
      const a = hash(zi * 1000 + i, 11) * Math.PI * 2, r = Math.sqrt(hash(zi * 1000 + i, 29)) * 3.2;
      const x = c.x + Math.cos(a) * r, zz = c.z + Math.sin(a) * r * 0.75, y = hAt(x, zz);
      if (y < 0.15) { m.makeScale(0, 0, 0); crown.setMatrixAt(ci++, m); fruit.setMatrixAt(fi++, m); fruit.setMatrixAt(fi++, m); continue; }
      m.makeTranslation(x, y + 0.14, zz); crown.setMatrixAt(ci++, m);
      m.makeTranslation(x + 0.08, y + 0.26, zz + 0.04); fruit.setMatrixAt(fi++, m);
      m.makeTranslation(x - 0.07, y + 0.2, zz - 0.07); fruit.setMatrixAt(fi++, m);
    }
    const hit = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, 1.2, 24).translate(0, 0.6, 0), new THREE.MeshBasicMaterial({ visible: false }));
    hit.position.set(c.x, hAt(c.x, c.z), c.z); groups.citrus.add(hit);
    register(hit, { name: z.name, type: "감귤 재배지", desc: "감귤 과수원이 모여 있는 지역 (범위는 대략). 겨울철에 수확합니다." });
    addLabel("citrus", z.name, hit.position, "", 1.4);
  });
  groups.citrus.add(crown, fruit);
}

// ================================================================ UI
const layersEl = $("layers");
for (const k in LAYERS) {
  const l = document.createElement("label"); l.className = "ly";
  l.innerHTML = `<input type="checkbox" checked data-k="${k}"><span class="sw" style="background:${LAYERS[k].color}"></span>${LAYERS[k].name}`;
  layersEl.appendChild(l);
}
layersEl.addEventListener("change", e => { const k = e.target.dataset.k; LAYERS[k].on = e.target.checked; groups[k].visible = e.target.checked; });
$("auto").onchange = e => { controls.autoRotate = e.target.checked; controls.autoRotateSpeed = 0.6; };

let month = 0;
const key = r => `${r["기준연도"]}.${String(r["기준월"]).padStart(2, "0")}`;
const fmt = n => n.toLocaleString("ko-KR");
function setRows(rows) {
  ROWS = rows.slice().sort((a, b) => key(a) < key(b) ? -1 : 1);
  $("month").max = ROWS.length - 1; $("month").value = ROWS.length - 1; month = ROWS.length - 1; applyMonth();
}
function applyMonth() {
  const row = ROWS[month]; if (!row) return;
  $("mlabel").textContent = `${row["기준연도"]}년 ${row["기준월"]}월`;
  const max = Math.max(...ROWS.flatMap(r => Object.keys(SPOTS).map(n => +r[n] || 0)));
  const list = Object.keys(SPOTS).map(n => [n, +row[n] || 0]).sort((a, b) => b[1] - a[1]);
  const top = list[0][1] || 1;
  $("rank").innerHTML = list.map(([n, v]) => `<button class="rk" data-n="${n}"><div style="display:flex;justify-content:space-between"><span>${n.replace("_", " ")}</span><b>${fmt(v)}명</b></div><div class="bar" style="width:${Math.max(3, v / top * 100)}%"></div></button>`).join("");
  for (const [n, v] of list) { const b = bars[n]; b.tgt = Math.max(0.05, v / max * 7); b.lb.el.textContent = `${n.replace("_", " ")} ${fmt(v)}`; }
}
$("month").oninput = e => { month = +e.target.value; applyMonth(); if (sel && sel.kind === "spot") showInfo(sel); };
$("rank").onclick = e => { const b = e.target.closest(".rk"); if (!b) return; const bar = bars[b.dataset.n]; select(bar.info, bar.base); };

let sel = null, flyT = null;
function showInfo(info) {
  sel = info; let html = `<span class="tp">${info.type}</span><h4>${info.name.replace("_", " ")}</h4><p>${info.desc}</p>`;
  if (info.kind === "spot") {
    const v = +ROWS[month][info.name] || 0;
    html += `<p><b>${ROWS[month]["기준연도"]}년 ${ROWS[month]["기준월"]}월 방문객: ${fmt(v)}명</b></p><div id="mini">` +
      ROWS.map((r, i) => { const x = +r[info.name] || 0, m = Math.max(...ROWS.map(q => +q[info.name] || 0)); return `<i class="${i === month ? "on" : ""}" style="height:${Math.max(4, x / m * 100)}%" title="${r["기준월"]}월 ${fmt(x)}명"></i>`; }).join("") + `</div>`;
  }
  $("ib").innerHTML = html; $("info").style.display = "block";
}
function select(info, point) {
  showInfo(info);
  if (point) { flyT = { from: camera.position.clone(), fromT: controls.target.clone(), to: point.clone().add(new THREE.Vector3(0, 8, 12)), toT: point.clone(), t: 0 }; $("auto").checked = false; controls.autoRotate = false; }
}
$("ix").onclick = () => { $("info").style.display = "none"; sel = null; };

// 클릭 선택
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener("pointerdown", e => { down = [e.clientX, e.clientY]; flyT = null; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(mouse, camera);
  const objs = clickable.filter(o => { let p = o; while (p && p !== scene) { if (p.visible === false) return false; p = p.parent; } return true; });
  const hit = ray.intersectObjects(objs, true)[0];
  if (hit) { let o = hit.object; while (o && !o.userData.info) o = o.parent; if (o) select(o.userData.info, hit.point); }
});

addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ================================================================ 루프
const v3 = new THREE.Vector3(), clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  for (const r of rotors) r.rotation.z -= dt * 2.2;
  for (const b of beams) b.rotation.y += dt * 1.6;
  for (const n in bars) { const b = bars[n]; b.cur += (b.tgt - b.cur) * Math.min(1, dt * 5); b.cyl.scale.y = b.cur; b.cap.position.y = b.cur; b.lb.point.set(b.base.x, b.base.y + b.cur + 1.3, b.base.z); }
  if (flyT) {
    flyT.t = Math.min(1, flyT.t + dt * 0.9); const k = flyT.t * flyT.t * (3 - 2 * flyT.t);
    camera.position.lerpVectors(flyT.from, flyT.to, k); controls.target.lerpVectors(flyT.fromT, flyT.toT, k); if (flyT.t >= 1) flyT = null;
  }
  controls.update();
  const cp = camera.position;
  for (const it of labelItems) {
    const vis = LAYERS[it.layer].on; if (!vis) { it.el.style.display = "none"; continue; }
    v3.copy(it.point).project(camera);
    if (v3.z > 1 || Math.abs(v3.x) > 1.1 || Math.abs(v3.y) > 1.1) { it.el.style.display = "none"; continue; }
    const d = cp.distanceTo(it.point), far = it.layer === "spot" ? 1 : clamp(1.4 - d / 110, 0, 1);
    if (far < 0.15) { it.el.style.display = "none"; continue; }
    it.el.style.display = "block"; it.el.style.opacity = far;
    it.el.style.transform = `translate(-50%,-100%) translate(${(v3.x * 0.5 + 0.5) * innerWidth}px,${(-v3.y * 0.5 + 0.5) * innerHeight}px)`;
  }
  renderer.render(scene, camera);
}

setRows(ROWS);
if (PO_API) fetch(PO_API).then(r => r.json()).then(j => { if (j && j.data && j.data.length) setRows(j.data); }).catch(() => {});
frame();
</script>
</body>
</html>
